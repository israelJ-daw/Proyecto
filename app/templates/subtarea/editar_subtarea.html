{% extends "estructura/principal.html" %}

{% block contenido %}
<h2>Editar subtarea: {{ subtarea.titulo }}</h2>

<form method="POST">
    {% csrf_token %}
    {{ formulario.as_p }}
    <button type="submit" class="btn btn-guapo">Guardar cambios</button>
</form>

<a href="{% url 'listar_subtareas' subtarea.tarea.id %}" class="btn btn-secondary mt-2">Volver a subtareas</a>
{% endblock %}
